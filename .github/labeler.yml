# SEE .github/workflows/labeler.yml
# SEE https://github.com/actions/labeler

CI:
  - changed-files:
      - any-glob-to-any-file: [".github/**/*"]

core:
  - changed-files:
      - any-glob-to-any-file: ["packages/core/**/*"]

cli:
  - changed-files:
      - any-glob-to-any-file: ["packages/cli/**/*"]

http:
  - changed-files:
      - any-glob-to-any-file: ["packages/http/**/*"]

mcp:
  - changed-files:
      - any-glob-to-any-file: ["packages/mcp/**/*"]

slack:
  - changed-files:
      - any-glob-to-any-file: ["packages/slack/**/*"]

docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**/*.md", "**/README.md"]
