name: Live X smoke test

# Spends real X API credits. Only runs when started manually.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-x
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run budget-limited live smoke test
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          XBOT_LIVE_TEST: "1"
        run: pnpm vitest run tests/live --dir . --config vitest.live.config.ts
