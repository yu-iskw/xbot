services:
  postgres:
    image: postgres:16
    container_name: dbt-package-template-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbt_package_template
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbt_package_template"]
      interval: 2s
      timeout: 5s
      retries: 20
